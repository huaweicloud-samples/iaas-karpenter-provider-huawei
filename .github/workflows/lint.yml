name: Lint

on:
  pull_request:
    types:
    - opened
    - edited
    - synchronize
    - reopened

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

      - name: Verify Helm manifests
        run: make verify-manifests
