name: Releases

on:
  push:
    tags:
    - v*

permissions:
  contents: write
  packages: write

jobs:
  releases:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set release info
      run: |
        echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "IMAGE_REPO=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log into registry ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      env:
        RELEASE_IMAGE_NAME: ${{ vars.RELEASE_IMAGE_NAME }}
      run: |
        make_args=(IMAGE_REPO="$IMAGE_REPO" RELEASE_TAG="$RELEASE_TAG")
        if [ -n "$RELEASE_IMAGE_NAME" ]; then
          make_args+=(IMAGE_NAME="$(echo "$RELEASE_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')")
        fi
        echo "Release tag is: $RELEASE_TAG"
        echo "Release image is: $(make print-image "${make_args[@]}")"
        make docker-buildx "${make_args[@]}"
    - name: Run release
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean --config .goreleaser.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-publish:
    name: Publish Helm chart to ghcr.io
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@v4
    - name: Set release info
      run: |
        echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "IMAGE_REPO=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
    - name: Setup Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.16.4
    - name: Login to registry ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify chart version matches tag
      run: |
        CHART_VERSION="$(sed -n 's/^version:[[:space:]]*//p' charts/karpenter-provider-huawei/Chart.yaml)"
        if [ "${CHART_VERSION}" != "${RELEASE_TAG#v}" ]; then
          echo "Chart version ${CHART_VERSION} does not match tag ${RELEASE_TAG}"
          exit 1
        fi
    - name: Package chart
      run: |
        helm lint charts/karpenter-provider-huawei
        helm package charts/karpenter-provider-huawei --destination charts
    - name: Push chart
      run: |
        OCI_REF="oci://ghcr.io/${IMAGE_REPO}/charts"
        CHART_TGZ="charts/karpenter-provider-huawei-${RELEASE_TAG#v}.tgz"
        echo "Pushing ${CHART_TGZ} to ${OCI_REF}"
        helm push "${CHART_TGZ}" "${OCI_REF}"
